[package]
name = "java-manager"
version = "1.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sysinfo = "0.30"
crossterm = "0.28.1"
crossterm_input = "0.5.0"
lazy_static = "1.5.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[target.'cfg(windows)'.dependencies] 
winreg = "0.52.0"
windows-sys = { version = "0.61.2", features = [ "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging" ]}
